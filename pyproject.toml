[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "igris"
version = "3B.53"
description = "IGRIS Multilingual Decoder-Only Transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tokenizers>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "regex>=2024.5.15",
]

[tool.setuptools.packages.find]
where = ["src"]
